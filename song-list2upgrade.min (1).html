ndom-song" class="fab" type="button" aria-label="랜덤 노래 뽑기">🎲</button></div><div id="popup-backdrop"><div id="popup-content"></div></div><script>const SHEET_CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSI_tRPXggLNbTJ9yO9PhWB05zzCWzCSjn6RdX6sR6ndXMpsvgU7sJnGnbL4w70-g/pub?gid=905413231&single=true&output=csv";
const genreCategory = {
ballad: "발라드",
jpop: "일본",
pop: "팝",
dance: "댄스",
romantic: "로맨틱",
indie: "인디",
"r&b": "R&B",
acoustic: "어쿠스틱",
rock: "록",
};
(function initTheme() {
const saved = localStorage.getItem("songlist-theme");
document.documentElement.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
document.addEventListener("DOMContentLoaded", () => {
const btn = document.getElementById("theme-toggle");
const paint = () => {
const t = document.documentElement.getAttribute("data-theme");
btn.textContent = t === "dark" ? "☀️" : "🌙";
document
.querySelector('meta[name="theme-color"]')
.setAttribute("content", t === "dark" ? "#150f1c" : "#fff5f9");
};
paint();
btn.addEventListener("click", () => {
const next =
document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
document.documentElement.setAttribute("data-theme", next);
localStorage.setItem("songlist-theme", next);
paint();
});
});
})();
function parseCSV(text) {
const lines = text.trim().split("\n");
if (lines.length < 2) return [];
const headers = lines[0]
.split(",")
.map((h) => h.trim().toLowerCase().replace(/\r/g, ""));
const rows = [];
for (let i = 1; i < lines.length; i++) {
const cols = [];
let cur = "",
inQ = false;
for (let c = 0; c < lines[i].length; c++) {
const ch = lines[i][c];
if (ch === '"') {
inQ = !inQ;
} else if (ch === "," && !inQ) {
cols.push(cur.trim());
cur = "";
} else {
cur += ch;
}
}
cols.push(cur.trim().replace(/\r/g, ""));
const row = {};
headers.forEach((h, idx) => {
row[h] = cols[idx] || "";
});
rows.push(row);
}
return rows;
}
function getKoreanLetter(name) {
const code = name.charCodeAt(0);
if (code >= 0xac00 && code <= 0xd7a3) {
const leads = [
"ㄱ",
"ㄱ",
"ㄴ",
"ㄷ",
"ㄷ",
"ㄹ",
"ㅁ",
"ㅂ",
"ㅂ",
"ㅅ",
"ㅅ",
"ㅇ",
"ㅈ",
"ㅈ",
"ㅊ",
"ㅋ",
"ㅌ",
"ㅍ",
"ㅎ",
];
return leads[Math.floor((code - 0xac00) / 588)];
}
const upper = name[0].toUpperCase();
if (/[A-Z]/.test(upper)) return upper;
return "#";
}
function buildSongList(rows) {
